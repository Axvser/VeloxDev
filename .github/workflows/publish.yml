name: publish

# Publishes every VeloxDev package through NuGet Trusted Publishing (GitHub OIDC).
# No long-lived NUGET_API_KEY is stored in this repository or in GitHub secrets.
#
# NuGet.org Trusted Publishing policy must match:
#   Package Owner   Axvser
#   CI/CD Provider  GitHub Actions
#   Repo Owner      Axvser
#   Repository      VeloxDev
#   Workflow File   publish.yml
#   Environment     (blank)
#   Glob Patterns   VeloxDev.*
#
# Trigger:
#   - push to master when package sources change. The version is read from
#     Src/Core/VeloxDev.Core/VeloxDev.Core.csproj, and every package is checked against NuGet:
#     only the ones missing for that version are packed and pushed. When all 18 are already
#     there, the release job is skipped; bump <Version> in the csproj to publish.
#   - manual workflow_dispatch; the default run publishes only the missing packages, so a run
#     that failed halfway can be retried without repacking what already landed. `force` treats
#     every package as missing and re-runs the whole pipeline (duplicates are skipped with
#     --skip-duplicate).
#
# Auto vs manual:
#   The push trigger is only acted on when the repository variable AUTO_PUBLISH is set to
#   "true" (Settings -> Secrets and variables -> Actions -> Variables). Unset or "false"
#   makes the workflow manual-only: a push starts a run that skips every job; use
#   workflow_dispatch or `gh workflow run` to release.
#
# Patch cleanup:
#   If the version is X1.X2.X3 with X3 > 0, the workflow unlists every older X1.X2.<i>
#   (i < X3) for all 18 packages after the new version is published, so only the highest
#   patch of that major/minor line stays listed. A major/minor change does not touch older
#   lines. The NuGet policy must include the "Unlist or relist package versions" scope.

on:
  push:
    branches: [master]
    paths:
      - 'Src/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when this version already exists on NuGet'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: veloxdev-publish
  cancel-in-progress: false

jobs:
  version:
    # Manual runs always proceed. Push runs only proceed when the repository variable
    # AUTO_PUBLISH is "true"; otherwise the run is a no-op.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
      generator_missing: ${{ steps.read.outputs.generator_missing }}
      core_missing: ${{ steps.read.outputs.core_missing }}
      rest_missing: ${{ steps.read.outputs.rest_missing }}
      cli_missing: ${{ steps.read.outputs.cli_missing }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version and find what NuGet is still missing
        id: read
        shell: pwsh
        run: |
          $core = "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj"
          $match = [regex]::Match((Get-Content $core -Raw), '<Version>([^<]+)</Version>')
          if (-not $match.Success) { throw "no <Version> in $core" }
          $version = $match.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

          $projects = @(
            "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj",
            "Src/Core/VeloxDev.Core.Extension/VeloxDev.Core.Extension.csproj",
            "Src/Generators/VeloxDev.Core.Generator/VeloxDev.Core.Generator.csproj",
            "Src/Adapters/VeloxDev.WPF/VeloxDev.WPF.csproj",
            "Src/Adapters/VeloxDev.Avalonia/VeloxDev.Avalonia.csproj",
            "Src/Adapters/VeloxDev.WinUI/VeloxDev.WinUI.csproj",
            "Src/Adapters/VeloxDev.MAUI/VeloxDev.MAUI.csproj",
            "Src/Adapters/VeloxDev.Razor/VeloxDev.Razor.csproj",
            "Src/Adapters/VeloxDev.WinForms/VeloxDev.WinForms.csproj",
            "Src/Adapters/VeloxDev.Jalium/VeloxDev.Jalium.csproj",
            "Src/Templates/VeloxDev.WPF.Templates/working/VeloxDev.WPF.Templates.csproj",
            "Src/Templates/VeloxDev.Avalonia.Templates/working/VeloxDev.Avalonia.Templates.csproj",
            "Src/Templates/VeloxDev.WinUI.Templates/working/VeloxDev.WinUI.Templates.csproj",
            "Src/Templates/VeloxDev.MAUI.Templates/working/VeloxDev.MAUI.Templates.csproj",
            "Src/Templates/VeloxDev.Razor.Templates/working/VeloxDev.Razor.Templates.csproj",
            "Src/Templates/VeloxDev.WinForms.Templates/working/VeloxDev.WinForms.Templates.csproj",
            "Src/Templates/VeloxDev.Jalium.Templates/VeloxDev.Jalium.Templates.csproj",
            "Src/Cli/VeloxDev.Cli/VeloxDev.Cli.csproj"
          )
          foreach ($project in $projects) {
            if (-not (Test-Path $project)) { throw "missing $project" }
            $value = [regex]::Match((Get-Content $project -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
            if ($value -ne $version) { throw "$project is '$value', expected '$version'" }
          }

          # Every package is checked on its own, so a run that stopped halfway can be retried and
          # only repacks what NuGet is still missing. Package ids equal their csproj file names.
          # force keeps the old meaning: pretend nothing is published and run the whole pipeline
          # (duplicates are skipped at push time).
          $force = "${{ inputs.force }}" -eq "true"
          $missing = @()
          foreach ($project in $projects) {
            $id = [IO.Path]::GetFileNameWithoutExtension($project)
            $exists = $false
            if (-not $force) {
              $lower = $id.ToLowerInvariant()
              $url = "https://api.nuget.org/v3-flatcontainer/$lower/$version/$lower.$version.nupkg"
              try { Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null; $exists = $true } catch { }
            }
            if ($exists) {
              Write-Host "$id $version is already on NuGet"
            } else {
              Write-Host "$id $version is missing"
              $missing += $id
            }
          }

          function To-Bool([bool]$value) { if ($value) { "true" } else { "false" } }
          $rest = @($missing | Where-Object { $_ -ne "VeloxDev.Core.Generator" -and $_ -ne "VeloxDev.Core" })
          "publish=$(To-Bool ($missing.Count -gt 0))" >> $env:GITHUB_OUTPUT
          "generator_missing=$(To-Bool ($missing -contains 'VeloxDev.Core.Generator'))" >> $env:GITHUB_OUTPUT
          "core_missing=$(To-Bool ($missing -contains 'VeloxDev.Core'))" >> $env:GITHUB_OUTPUT
          "rest_missing=$($rest -join ' ')" >> $env:GITHUB_OUTPUT
          "cli_missing=$(To-Bool ($missing -contains 'VeloxDev.Cli'))" >> $env:GITHUB_OUTPUT

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ensure the .NET Framework 4.6.1 targeting pack
        # Core and the WPF / WinForms adapters target netframework4.6.1; skip the install when
        # none of them is being packed.
        if: needs.version.outputs.core_missing == 'true' || contains(needs.version.outputs.rest_missing, 'VeloxDev.WPF') || contains(needs.version.outputs.rest_missing, 'VeloxDev.WinForms')
        shell: pwsh
        run: |
          $pack = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1"
          if (-not (Test-Path $pack)) {
            choco install netfx-4.6.1-devpack -y --no-progress
          }

      - name: Install the MAUI workload
        if: contains(needs.version.outputs.rest_missing, 'VeloxDev.MAUI')
        shell: pwsh
        run: dotnet workload install maui

      - name: Build and pack the generator
        if: needs.version.outputs.generator_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # Build first with pack-on-build disabled: the generator packs a bin/... DLL through a
          # custom None item, and a direct `dotnet pack` can evaluate it before that DLL exists.
          dotnet build "Src/Generators/VeloxDev.Core.Generator/VeloxDev.Core.Generator.csproj" `
            -c Release `
            -p:Version=$env:VERSION `
            -p:PackageVersion=$env:VERSION `
            -p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { throw "build failed: generator" }
          dotnet pack "Src/Generators/VeloxDev.Core.Generator/VeloxDev.Core.Generator.csproj" `
            -c Release -o artifacts --no-build `
            -p:Version=$env:VERSION `
            -p:PackageVersion=$env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "pack failed: generator" }

      - name: NuGet login (OIDC -> temporary key)
        id: login
        if: needs.version.outputs.generator_missing == 'true' || needs.version.outputs.core_missing == 'true'
        uses: NuGet/login@v1
        with:
          user: Axvser

      - name: Push the generator and wait until NuGet can serve it
        if: needs.version.outputs.generator_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          function Push-One([string]$id) {
            $file = Join-Path "artifacts" "$id.${env:VERSION}.nupkg"
            if (-not (Test-Path $file)) { throw "missing $file" }
            dotnet nuget push $file --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $id" }
          }
          function Wait-One([string]$id) {
            $lower = $id.ToLowerInvariant()
            $url = "https://api.nuget.org/v3-flatcontainer/$lower/${env:VERSION}/$lower.${env:VERSION}.nupkg"
            $deadline = (Get-Date).AddMinutes(15)
            while ($true) {
              try {
                Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
                return
              } catch {
                if ((Get-Date) -gt $deadline) { throw "$id did not appear within 15 minutes" }
                Start-Sleep -Seconds 10
              }
            }
          }
          Push-One "VeloxDev.Core.Generator"
          Wait-One "VeloxDev.Core.Generator"

      - name: Pack Core against the published generator
        if: needs.version.outputs.core_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # No VeloxDevLocalCore here: the generator must resolve from NuGet, and the pack must
          # carry that dependency in its nuspec. Build first, then pack the built output.
          dotnet build "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj" `
            -c Release `
            -p:Version=$env:VERSION `
            -p:PackageVersion=$env:VERSION `
            -p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { throw "build failed: Core" }
          dotnet pack "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj" `
            -c Release -o artifacts --no-build `
            -p:Version=$env:VERSION `
            -p:PackageVersion=$env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "pack failed: Core" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $file = Join-Path "artifacts" "VeloxDev.Core.${env:VERSION}.nupkg"
          $zip = [IO.Compression.ZipFile]::OpenRead($file)
          $entry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" }
          $reader = New-Object IO.StreamReader($entry.Open())
          $nuspec = $reader.ReadToEnd()
          $reader.Dispose()
          $zip.Dispose()
          if ($nuspec -notmatch '<dependency id="VeloxDev.Core.Generator"') {
            throw "Core nuspec lost its VeloxDev.Core.Generator dependency; refusing to publish it."
          }

      - name: Push Core and wait until NuGet can serve it
        if: needs.version.outputs.core_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          function Push-One([string]$id) {
            $file = Join-Path "artifacts" "$id.${env:VERSION}.nupkg"
            if (-not (Test-Path $file)) { throw "missing $file" }
            dotnet nuget push $file --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $id" }
          }
          function Wait-One([string]$id) {
            $lower = $id.ToLowerInvariant()
            $url = "https://api.nuget.org/v3-flatcontainer/$lower/${env:VERSION}/$lower.${env:VERSION}.nupkg"
            $deadline = (Get-Date).AddMinutes(15)
            while ($true) {
              try {
                Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
                return
              } catch {
                if ((Get-Date) -gt $deadline) { throw "$id did not appear within 15 minutes" }
                Start-Sleep -Seconds 10
              }
            }
          }
          Push-One "VeloxDev.Core"
          Wait-One "VeloxDev.Core"

      - name: Pack the dependents, templates and CLI against NuGet
        if: needs.version.outputs.rest_missing != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MISSING: ${{ needs.version.outputs.rest_missing }}
        run: |
          # No VeloxDevLocalCore: Core and the generator are on NuGet now, and every dependent
          # package must carry the real dependency in its nuspec.
          # Only the packages NuGet is still missing are packed; ids equal their csproj file names.
          $missing = @("$env:MISSING" -split ' ' | Where-Object { $_ })
          $projects = @(
            "Src/Core/VeloxDev.Core.Extension/VeloxDev.Core.Extension.csproj",
            "Src/Adapters/VeloxDev.WPF/VeloxDev.WPF.csproj",
            "Src/Adapters/VeloxDev.Avalonia/VeloxDev.Avalonia.csproj",
            "Src/Adapters/VeloxDev.WinUI/VeloxDev.WinUI.csproj",
            "Src/Adapters/VeloxDev.MAUI/VeloxDev.MAUI.csproj",
            "Src/Adapters/VeloxDev.Razor/VeloxDev.Razor.csproj",
            "Src/Adapters/VeloxDev.WinForms/VeloxDev.WinForms.csproj",
            "Src/Adapters/VeloxDev.Jalium/VeloxDev.Jalium.csproj",
            "Src/Templates/VeloxDev.WPF.Templates/working/VeloxDev.WPF.Templates.csproj",
            "Src/Templates/VeloxDev.Avalonia.Templates/working/VeloxDev.Avalonia.Templates.csproj",
            "Src/Templates/VeloxDev.WinUI.Templates/working/VeloxDev.WinUI.Templates.csproj",
            "Src/Templates/VeloxDev.MAUI.Templates/working/VeloxDev.MAUI.Templates.csproj",
            "Src/Templates/VeloxDev.Razor.Templates/working/VeloxDev.Razor.Templates.csproj",
            "Src/Templates/VeloxDev.WinForms.Templates/working/VeloxDev.WinForms.Templates.csproj",
            "Src/Templates/VeloxDev.Jalium.Templates/VeloxDev.Jalium.Templates.csproj",
            "Src/Cli/VeloxDev.Cli/VeloxDev.Cli.csproj"
          )
          foreach ($project in $projects) {
            $id = [IO.Path]::GetFileNameWithoutExtension($project)
            if ($missing -notcontains $id) {
              Write-Host "$id $env:VERSION is already on NuGet; skipping"
              continue
            }
            # GeneratePackageOnBuild=true strips Build out of GenerateNuspecDependsOn, so a plain
            # `dotnet pack` restores and then packs a DLL that was never built (NU5026). Turning it
            # off for this invocation lets pack build the project first.
            dotnet pack $project -c Release -o artifacts `
              -p:Version=$env:VERSION `
              -p:PackageVersion=$env:VERSION `
              -p:GeneratePackageOnBuild=false
            if ($LASTEXITCODE -ne 0) { throw "pack failed: $project" }
          }

          # A representative adapter must declare Core, or the published package cannot restore.
          # Only check it when WPF was packed in this run; an already-published nupkg is immutable.
          if ($missing -contains "VeloxDev.WPF") {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $file = Join-Path "artifacts" "VeloxDev.WPF.${env:VERSION}.nupkg"
            $zip = [IO.Compression.ZipFile]::OpenRead($file)
            $entry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" }
            $reader = New-Object IO.StreamReader($entry.Open())
            $nuspec = $reader.ReadToEnd()
            $reader.Dispose()
            $zip.Dispose()
            if ($nuspec -notmatch '<dependency id="VeloxDev.Core"') {
              throw "VeloxDev.WPF nuspec lost its VeloxDev.Core dependency; refusing to publish it."
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: VeloxDev.${{ needs.version.outputs.version }}
          path: artifacts/*.nupkg

      - name: NuGet login (fresh key for the remaining pushes)
        id: login2
        uses: NuGet/login@v1
        with:
          user: Axvser

      - name: Push the rest
        if: needs.version.outputs.rest_missing != ''
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login2.outputs.NUGET_API_KEY }}
        run: |
          $skip = @(
            "VeloxDev.Core.Generator.${env:VERSION}.nupkg",
            "VeloxDev.Core.${env:VERSION}.nupkg"
          )
          Get-ChildItem artifacts -Filter "*.nupkg" |
            Where-Object { $skip -notcontains $_.Name } |
            ForEach-Object {
              dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "push failed: $($_.Name)" }
            }

      - name: Unlist older patches of the same major/minor
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login2.outputs.NUGET_API_KEY }}
        run: |
          if ($env:VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            Write-Host "Version '$env:VERSION' is not X.Y.Z; skipping patch cleanup."
            return
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          if ($patch -le 0) {
            Write-Host "Patch is 0; there are no older patches to unlist."
            return
          }

          # One list for every published package. Missing or already-unlisted versions are
          # expected and do not fail the release.
          $ids = @(
            "VeloxDev.Core.Generator", "VeloxDev.Core", "VeloxDev.Core.Extension",
            "VeloxDev.WPF", "VeloxDev.Avalonia", "VeloxDev.WinUI", "VeloxDev.MAUI",
            "VeloxDev.Razor", "VeloxDev.WinForms", "VeloxDev.Jalium",
            "VeloxDev.WPF.Templates", "VeloxDev.Avalonia.Templates", "VeloxDev.WinUI.Templates",
            "VeloxDev.MAUI.Templates", "VeloxDev.Razor.Templates", "VeloxDev.WinForms.Templates",
            "VeloxDev.Jalium.Templates", "VeloxDev.Cli"
          )
          foreach ($id in $ids) {
            for ($i = 0; $i -lt $patch; $i++) {
              $old = "$major.$minor.$i"
              Write-Host "Unlisting $id $old"
              dotnet nuget delete $id $old --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json --non-interactive
              if ($LASTEXITCODE -ne 0) {
                Write-Host "  (not found or already unlisted; continuing)"
              }
            }
          }

      - name: Verify the published tool
        if: needs.version.outputs.cli_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/veloxdev.cli/${env:VERSION}/veloxdev.cli.${env:VERSION}.nupkg"
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            try {
              Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
              break
            } catch {
              if ((Get-Date) -gt $deadline) { throw "VeloxDev.Cli did not appear within 15 minutes" }
              Start-Sleep -Seconds 10
            }
          }
          $tool = Join-Path $env:RUNNER_TEMP "veloxdev-tool"
          dotnet tool install --tool-path $tool VeloxDev.Cli --version $env:VERSION
          & (Join-Path $tool "veloxdev.exe") --help
