name: publish

# Publishes every VeloxDev package through NuGet Trusted Publishing (GitHub OIDC).
# No long-lived NUGET_API_KEY is stored in this repository or in GitHub secrets.
#
# NuGet.org Trusted Publishing policy must match:
#   Package Owner   Axvser
#   CI/CD Provider  GitHub Actions
#   Repo Owner      Axvser
#   Repository      VeloxDev
#   Workflow File   publish.yml
#   Environment     (blank)
#   Glob Patterns   VeloxDev.*
#
# Versioning:
#   Every package is published at the <Version> written in its own csproj. The workflow checks
#   one thing: whether that exact version is already on NuGet. A package whose version is not
#   there is packed and pushed; a package whose version is already there is skipped. The layer
#   rules in memory/specifications/version-management-specifications.md (generator ≥ Core,
#   downstream syncing to Core, templates staying put) are the developer's decision, not a gate
#   here.
#
# Trigger:
#   - push to master when package sources change. Each package's own <Version> is read, and only
#     the packages NuGet is still missing for that version are packed and pushed. When nothing is
#     missing, the release job is skipped; bump a <Version> to publish.
#   - manual workflow_dispatch; the default run publishes only the missing packages, so a run
#     that failed halfway can be retried without repacking what already landed. `force` treats
#     every package as missing and re-runs the whole pipeline (duplicates are skipped with
#     --skip-duplicate).
#
# Auto vs manual:
#   The push trigger is only acted on when the repository variable AUTO_PUBLISH is set to
#   "true" (Settings -> Secrets and variables -> Actions -> Variables). Unset or "false"
#   makes the workflow manual-only: a push starts a run that skips every job; use
#   workflow_dispatch or `gh workflow run` to release.
#
# Patch cleanup:
#   After a package is pushed, if its version is X1.X2.X3 with X3 > 0, the workflow unlists that
#   package's older X1.X2.<i> (i < X3), so only the highest patch of its own line stays listed.
#   A major/minor change does not touch older lines, and a package that was not pushed this run
#   is left alone. The NuGet policy must include the "Unlist or relist package versions" scope.

on:
  push:
    branches: [master]
    paths:
      - 'Src/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when these versions already exist on NuGet'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: veloxdev-publish
  cancel-in-progress: false

jobs:
  version:
    # Manual runs always proceed. Push runs only proceed when the repository variable
    # AUTO_PUBLISH is "true"; otherwise the run is a no-op.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.read.outputs.publish }}
      generator_missing: ${{ steps.read.outputs.generator_missing }}
      generator_version: ${{ steps.read.outputs.generator_version }}
      core_missing: ${{ steps.read.outputs.core_missing }}
      core_version: ${{ steps.read.outputs.core_version }}
      cli_missing: ${{ steps.read.outputs.cli_missing }}
      cli_version: ${{ steps.read.outputs.cli_version }}
      rest_missing: ${{ steps.read.outputs.rest_missing }}
      missing: ${{ steps.read.outputs.missing }}
    steps:
      - uses: actions/checkout@v7

      - name: Read every package's own version and find what NuGet is missing
        id: read
        shell: pwsh
        run: |
          $projects = @(
            @{ Id = "VeloxDev.Core.Generator"; Kind = "generator"; Path = "Src/Generators/VeloxDev.Core.Generator/VeloxDev.Core.Generator.csproj" },
            @{ Id = "VeloxDev.Core"; Kind = "core"; Path = "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj" },
            @{ Id = "VeloxDev.Core.Extension"; Kind = "dependent"; Path = "Src/Core/VeloxDev.Core.Extension/VeloxDev.Core.Extension.csproj" },
            @{ Id = "VeloxDev.WPF"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.WPF/VeloxDev.WPF.csproj" },
            @{ Id = "VeloxDev.Avalonia"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.Avalonia/VeloxDev.Avalonia.csproj" },
            @{ Id = "VeloxDev.WinUI"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.WinUI/VeloxDev.WinUI.csproj" },
            @{ Id = "VeloxDev.MAUI"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.MAUI/VeloxDev.MAUI.csproj" },
            @{ Id = "VeloxDev.Razor"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.Razor/VeloxDev.Razor.csproj" },
            @{ Id = "VeloxDev.WinForms"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.WinForms/VeloxDev.WinForms.csproj" },
            @{ Id = "VeloxDev.Jalium"; Kind = "dependent"; Path = "Src/Adapters/VeloxDev.Jalium/VeloxDev.Jalium.csproj" },
            @{ Id = "VeloxDev.WPF.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.WPF.Templates/working/VeloxDev.WPF.Templates.csproj" },
            @{ Id = "VeloxDev.Avalonia.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.Avalonia.Templates/working/VeloxDev.Avalonia.Templates.csproj" },
            @{ Id = "VeloxDev.WinUI.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.WinUI.Templates/working/VeloxDev.WinUI.Templates.csproj" },
            @{ Id = "VeloxDev.MAUI.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.MAUI.Templates/working/VeloxDev.MAUI.Templates.csproj" },
            @{ Id = "VeloxDev.Razor.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.Razor.Templates/working/VeloxDev.Razor.Templates.csproj" },
            @{ Id = "VeloxDev.WinForms.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.WinForms.Templates/working/VeloxDev.WinForms.Templates.csproj" },
            @{ Id = "VeloxDev.Jalium.Templates"; Kind = "template"; Path = "Src/Templates/VeloxDev.Jalium.Templates/VeloxDev.Jalium.Templates.csproj" },
            @{ Id = "VeloxDev.Cli"; Kind = "dependent"; Path = "Src/Cli/VeloxDev.Cli/VeloxDev.Cli.csproj" }
          )

          foreach ($project in $projects) {
            if (-not (Test-Path $project.Path)) { throw "missing $($project.Path)" }
            $match = [regex]::Match((Get-Content $project.Path -Raw), '<Version>([^<]+)</Version>')
            if (-not $match.Success) { throw "no <Version> in $($project.Path)" }
            $project.Version = $match.Groups[1].Value
          }

          # Every package is checked on its own, so a run that stopped halfway can be retried and
          # only repacks what NuGet is still missing. Package ids equal their csproj file names.
          # force keeps the old meaning: pretend nothing is published and run the whole pipeline
          # (duplicates are skipped at push time).
          $force = "${{ inputs.force }}" -eq "true"
          $missing = @()
          foreach ($project in $projects) {
            $exists = $false
            if (-not $force) {
              $id = $project.Id.ToLowerInvariant()
              $url = "https://api.nuget.org/v3-flatcontainer/$id/$($project.Version)/$id.$($project.Version).nupkg"
              try { Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null; $exists = $true } catch { }
            }
            if ($exists) {
              Write-Host "$($project.Id) $($project.Version) is already on NuGet"
            } else {
              Write-Host "$($project.Id) $($project.Version) is missing"
              $missing += $project
            }
          }

          function To-Bool([bool]$value) { if ($value) { "true" } else { "false" } }
          function Is-Missing([string]$kind) { return @($missing | Where-Object { $_.Kind -eq $kind }).Count -gt 0 }
          function Get-Version([string]$kind) {
            return ($projects | Where-Object { $_.Kind -eq $kind } | Select-Object -First 1).Version
          }

          $rest = @($missing | Where-Object { $_.Kind -eq 'dependent' -or $_.Kind -eq 'template' })
          $missingJson = ConvertTo-Json -Compress -InputObject @(
            $missing | ForEach-Object { [ordered]@{ id = $_.Id; version = $_.Version } }
          )
          $restJson = ConvertTo-Json -Compress -InputObject @(
            $rest | ForEach-Object { [ordered]@{ id = $_.Id; version = $_.Version } }
          )

          "publish=$(To-Bool ($missing.Count -gt 0))" >> $env:GITHUB_OUTPUT
          "generator_missing=$(To-Bool (Is-Missing 'generator'))" >> $env:GITHUB_OUTPUT
          "generator_version=$(Get-Version 'generator')" >> $env:GITHUB_OUTPUT
          "core_missing=$(To-Bool (Is-Missing 'core'))" >> $env:GITHUB_OUTPUT
          "core_version=$(Get-Version 'core')" >> $env:GITHUB_OUTPUT
          "cli_missing=$(To-Bool (@($missing | Where-Object { $_.Id -eq 'VeloxDev.Cli' }).Count -gt 0))" >> $env:GITHUB_OUTPUT
          "cli_version=$((($projects | Where-Object { $_.Id -eq 'VeloxDev.Cli' } | Select-Object -First 1).Version))" >> $env:GITHUB_OUTPUT
          "rest_missing=$restJson" >> $env:GITHUB_OUTPUT
          "missing=$missingJson" >> $env:GITHUB_OUTPUT

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ensure the .NET Framework 4.6.1 targeting pack
        # Core and the WPF / WinForms adapters target netframework4.6.1; skip the install when
        # none of them is being packed.
        if: needs.version.outputs.core_missing == 'true' || contains(needs.version.outputs.rest_missing, 'VeloxDev.WPF') || contains(needs.version.outputs.rest_missing, 'VeloxDev.WinForms')
        shell: pwsh
        run: |
          $pack = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.1"
          if (-not (Test-Path $pack)) {
            choco install netfx-4.6.1-devpack -y --no-progress
          }

      - name: Install the MAUI workload
        if: contains(needs.version.outputs.rest_missing, 'VeloxDev.MAUI')
        shell: pwsh
        run: dotnet workload install maui

      - name: Build and pack the generator
        if: needs.version.outputs.generator_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.generator_version }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # Build first with pack-on-build disabled: the generator packs a bin/... DLL through a
          # custom None item, and a direct `dotnet pack` can evaluate it before that DLL exists.
          dotnet build "Src/Generators/VeloxDev.Core.Generator/VeloxDev.Core.Generator.csproj" `
            -c Release `
            -p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { throw "build failed: generator" }
          dotnet pack "Src/Generators/VeloxDev.Core.Generator/VeloxDev.Core.Generator.csproj" `
            -c Release -o artifacts --no-build
          if ($LASTEXITCODE -ne 0) { throw "pack failed: generator" }

      - name: NuGet login (OIDC -> temporary key)
        id: login
        if: needs.version.outputs.generator_missing == 'true' || needs.version.outputs.core_missing == 'true'
        uses: NuGet/login@v1
        with:
          user: Axvser

      - name: Push the generator and wait until NuGet can serve it
        if: needs.version.outputs.generator_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.generator_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          function Push-One([string]$id) {
            $file = Join-Path "artifacts" "$id.${env:VERSION}.nupkg"
            if (-not (Test-Path $file)) { throw "missing $file" }
            dotnet nuget push $file --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $id" }
          }
          function Wait-One([string]$id) {
            $lower = $id.ToLowerInvariant()
            $url = "https://api.nuget.org/v3-flatcontainer/$lower/${env:VERSION}/$lower.${env:VERSION}.nupkg"
            $deadline = (Get-Date).AddMinutes(15)
            while ($true) {
              try {
                Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
                return
              } catch {
                if ((Get-Date) -gt $deadline) { throw "$id did not appear within 15 minutes" }
                Start-Sleep -Seconds 10
              }
            }
          }
          Push-One "VeloxDev.Core.Generator"
          Wait-One "VeloxDev.Core.Generator"

      - name: Wait for the generator on NuGet before Core
        # Core's Release build resolves the generator from NuGet. Even when the generator was not "missing"
        # at the start (already present) or the push step above was skipped, make the dependency explicit:
        # Core never packs until the exact generator version is downloadable.
        if: needs.version.outputs.core_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.generator_version }}
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/veloxdev.core.generator/${env:VERSION}/veloxdev.core.generator.${env:VERSION}.nupkg"
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            try {
              Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
              return
            } catch {
              if ((Get-Date) -gt $deadline) { throw "VeloxDev.Core.Generator $env:VERSION did not appear within 15 minutes" }
              Start-Sleep -Seconds 10
            }
          }

      - name: Pack Core against the published generator
        if: needs.version.outputs.core_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.core_version }}
        run: |
          # No VeloxDevLocalCore here: the generator must resolve from NuGet, and the pack must
          # carry that dependency in its nuspec. Build first, then pack the built output.
          dotnet build "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj" `
            -c Release `
            -p:GeneratePackageOnBuild=false
          if ($LASTEXITCODE -ne 0) { throw "build failed: Core" }
          dotnet pack "Src/Core/VeloxDev.Core/VeloxDev.Core.csproj" `
            -c Release -o artifacts --no-build
          if ($LASTEXITCODE -ne 0) { throw "pack failed: Core" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $file = Join-Path "artifacts" "VeloxDev.Core.${env:VERSION}.nupkg"
          $zip = [IO.Compression.ZipFile]::OpenRead($file)
          $entry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" }
          $reader = New-Object IO.StreamReader($entry.Open())
          $nuspec = $reader.ReadToEnd()
          $reader.Dispose()
          $zip.Dispose()
          if ($nuspec -notmatch '<dependency id="VeloxDev.Core.Generator"') {
            throw "Core nuspec lost its VeloxDev.Core.Generator dependency; refusing to publish it."
          }

      - name: Push Core and wait until NuGet can serve it
        if: needs.version.outputs.core_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.core_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          function Push-One([string]$id) {
            $file = Join-Path "artifacts" "$id.${env:VERSION}.nupkg"
            if (-not (Test-Path $file)) { throw "missing $file" }
            dotnet nuget push $file --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $id" }
          }
          function Wait-One([string]$id) {
            $lower = $id.ToLowerInvariant()
            $url = "https://api.nuget.org/v3-flatcontainer/$lower/${env:VERSION}/$lower.${env:VERSION}.nupkg"
            $deadline = (Get-Date).AddMinutes(15)
            while ($true) {
              try {
                Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
                return
              } catch {
                if ((Get-Date) -gt $deadline) { throw "$id did not appear within 15 minutes" }
                Start-Sleep -Seconds 10
              }
            }
          }
          Push-One "VeloxDev.Core"
          Wait-One "VeloxDev.Core"

      - name: Pack the dependents, templates and CLI against NuGet
        if: needs.version.outputs.rest_missing != '[]'
        shell: pwsh
        env:
          MISSING: ${{ needs.version.outputs.rest_missing }}
        run: |
          # No VeloxDevLocalCore: Core and the generator are on NuGet now, and every dependent
          # package must carry the real dependency in its nuspec.
          # Each package packs at the <Version> written in its own csproj; only the packages the
          # version stage found missing are packed.
          $paths = @{
            "VeloxDev.Core.Extension"  = "Src/Core/VeloxDev.Core.Extension/VeloxDev.Core.Extension.csproj"
            "VeloxDev.WPF"             = "Src/Adapters/VeloxDev.WPF/VeloxDev.WPF.csproj"
            "VeloxDev.Avalonia"        = "Src/Adapters/VeloxDev.Avalonia/VeloxDev.Avalonia.csproj"
            "VeloxDev.WinUI"           = "Src/Adapters/VeloxDev.WinUI/VeloxDev.WinUI.csproj"
            "VeloxDev.MAUI"            = "Src/Adapters/VeloxDev.MAUI/VeloxDev.MAUI.csproj"
            "VeloxDev.Razor"           = "Src/Adapters/VeloxDev.Razor/VeloxDev.Razor.csproj"
            "VeloxDev.WinForms"        = "Src/Adapters/VeloxDev.WinForms/VeloxDev.WinForms.csproj"
            "VeloxDev.Jalium"          = "Src/Adapters/VeloxDev.Jalium/VeloxDev.Jalium.csproj"
            "VeloxDev.WPF.Templates"   = "Src/Templates/VeloxDev.WPF.Templates/working/VeloxDev.WPF.Templates.csproj"
            "VeloxDev.Avalonia.Templates" = "Src/Templates/VeloxDev.Avalonia.Templates/working/VeloxDev.Avalonia.Templates.csproj"
            "VeloxDev.WinUI.Templates" = "Src/Templates/VeloxDev.WinUI.Templates/working/VeloxDev.WinUI.Templates.csproj"
            "VeloxDev.MAUI.Templates"  = "Src/Templates/VeloxDev.MAUI.Templates/working/VeloxDev.MAUI.Templates.csproj"
            "VeloxDev.Razor.Templates" = "Src/Templates/VeloxDev.Razor.Templates/working/VeloxDev.Razor.Templates.csproj"
            "VeloxDev.WinForms.Templates" = "Src/Templates/VeloxDev.WinForms.Templates/working/VeloxDev.WinForms.Templates.csproj"
            "VeloxDev.Jalium.Templates" = "Src/Templates/VeloxDev.Jalium.Templates/VeloxDev.Jalium.Templates.csproj"
            "VeloxDev.Cli"             = "Src/Cli/VeloxDev.Cli/VeloxDev.Cli.csproj"
          }

          $missing = @("$env:MISSING" | ConvertFrom-Json)
          foreach ($entry in $missing) {
            $project = $paths[$entry.id]
            if (-not $project) { throw "no project path for $($entry.id)" }
            # GeneratePackageOnBuild=true strips Build out of GenerateNuspecDependsOn, so a plain
            # `dotnet pack` restores and then packs a DLL that was never built (NU5026). Turning it
            # off for this invocation lets pack build the project first.
            Write-Host "packing $($entry.id) $($entry.version)"
            dotnet pack $project -c Release -o artifacts -p:GeneratePackageOnBuild=false
            if ($LASTEXITCODE -ne 0) { throw "pack failed: $project" }
          }

          # A representative adapter must declare Core, or the published package cannot restore.
          # Only check it when WPF was packed in this run; an already-published nupkg is immutable.
          $wpf = $missing | Where-Object { $_.id -eq "VeloxDev.WPF" } | Select-Object -First 1
          if ($null -ne $wpf) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $file = Join-Path "artifacts" "VeloxDev.WPF.$($wpf.version).nupkg"
            $zip = [IO.Compression.ZipFile]::OpenRead($file)
            $entry = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" }
            $reader = New-Object IO.StreamReader($entry.Open())
            $nuspec = $reader.ReadToEnd()
            $reader.Dispose()
            $zip.Dispose()
            if ($nuspec -notmatch '<dependency id="VeloxDev.Core"') {
              throw "VeloxDev.WPF nuspec lost its VeloxDev.Core dependency; refusing to publish it."
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: VeloxDev-${{ github.run_number }}
          path: artifacts/*.nupkg

      - name: NuGet login (fresh key for the remaining pushes)
        id: login2
        uses: NuGet/login@v1
        with:
          user: Axvser

      - name: Push the rest
        if: needs.version.outputs.rest_missing != '[]'
        shell: pwsh
        env:
          GENERATOR_VERSION: ${{ needs.version.outputs.generator_version }}
          CORE_VERSION: ${{ needs.version.outputs.core_version }}
          NUGET_API_KEY: ${{ steps.login2.outputs.NUGET_API_KEY }}
        run: |
          $skip = @(
            "VeloxDev.Core.Generator.${env:GENERATOR_VERSION}.nupkg",
            "VeloxDev.Core.${env:CORE_VERSION}.nupkg"
          )
          Get-ChildItem artifacts -Filter "*.nupkg" |
            Where-Object { $skip -notcontains $_.Name } |
            ForEach-Object {
              dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "push failed: $($_.Name)" }
            }

      - name: Unlist older patches of each pushed package's own line
        shell: pwsh
        env:
          MISSING: ${{ needs.version.outputs.missing }}
          NUGET_API_KEY: ${{ steps.login2.outputs.NUGET_API_KEY }}
        run: |
          # Only the packages pushed in this run are cleaned up, each on its own X1.X2 line.
          $missing = @("$env:MISSING" | ConvertFrom-Json)
          foreach ($entry in $missing) {
            if ($entry.version -notmatch '^(\d+)\.(\d+)\.(\d+)$') { continue }
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]
            if ($patch -le 0) { continue }
            for ($i = 0; $i -lt $patch; $i++) {
              $old = "$major.$minor.$i"
              Write-Host "Unlisting $($entry.id) $old"
              dotnet nuget delete $entry.id $old --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json --non-interactive
              if ($LASTEXITCODE -ne 0) {
                Write-Host "  (not found or already unlisted; continuing)"
              }
            }
          }

      - name: Verify the published tool
        if: needs.version.outputs.cli_missing == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.cli_version }}
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/veloxdev.cli/${env:VERSION}/veloxdev.cli.${env:VERSION}.nupkg"
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            try {
              Invoke-WebRequest $url -Method Head -UseBasicParsing -TimeoutSec 30 | Out-Null
              break
            } catch {
              if ((Get-Date) -gt $deadline) { throw "VeloxDev.Cli did not appear within 15 minutes" }
              Start-Sleep -Seconds 10
            }
          }
          # The flatcontainer endpoint can serve the nupkg before the feed's package index does,
          # so `dotnet tool install` may still report "version not found" for a few minutes.
          # Retry instead of failing a release that is already complete.
          $tool = Join-Path $env:RUNNER_TEMP "veloxdev-tool"
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            if (Test-Path $tool) { Remove-Item $tool -Recurse -Force }
            dotnet tool install --tool-path $tool VeloxDev.Cli --version $env:VERSION
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) { throw "VeloxDev.Cli $env:VERSION is not installable" }
            Start-Sleep -Seconds 15
          }
          & (Join-Path $tool "veloxdev.exe") --help
          if ($LASTEXITCODE -ne 0) { throw "veloxdev --help failed" }
